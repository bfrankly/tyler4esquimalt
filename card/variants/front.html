<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><title>Tyler 4 Esquimalt card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
@page { size: 3.75in 2.25in; margin: 0; }
html, body { margin: 0; padding: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: "Newsreader", Georgia, serif; }
.card { position: relative; width: 3.75in; height: 2.25in; overflow: hidden; page-break-after: always; break-after: page; }
.card:last-child { page-break-after: auto; break-after: auto; }
.disp { font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif; }
/* safe area: 0.375in from the bleed edge on every side */
.inner { position: absolute; left: 0.4in; right: 0.4in; top: 0.375in; bottom: 0.375in; display: grid; grid-template-rows: 1fr auto; row-gap: 0.05in; }
.auth { font-size: 4.5pt; letter-spacing: .01em; line-height: 1.2; }
.qr { display: block; }
.photo { border-radius: 50%; object-fit: cover; display: block; }
.em { font-style: normal; color: #C4522A; }
/* front */
.front { background: #0E4F5C; color: #fff; }
.front .rule { position: absolute; inset: 0.25in; border: 2px solid rgba(255,255,255,.38); border-radius: 3px; }
.front .fin { position: absolute; left: 0.42in; top: 0.4in; right: 0.42in; bottom: 0.4in; }
.front .eyebrow { font-size: 5.6pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #E9B640; }
.front h1 { margin: 0.08in 0 0; font-size: 33pt; font-weight: 800; line-height: .9; letter-spacing: -0.03em; text-transform: uppercase; }
.front .for { margin-top: 0.08in; font-size: 11.5pt; font-weight: 500; letter-spacing: -0.01em; }
.front .for b { font-weight: 800; }
.sticker { position: absolute; right: 0.4in; top: 0.4in; width: 0.84in; height: 0.84in; border-radius: 50%; background: #C4522A; color: #fff; display: grid; place-content: center; text-align: center; line-height: 1.05; transform: rotate(8deg); text-transform: uppercase; letter-spacing: .05em; }
.sticker small { display: block; font-size: 4.6pt; font-weight: 700; letter-spacing: .14em; }
.sticker b { display: block; font-size: 11pt; font-weight: 800; margin: .02in 0; }

/* A: photo + pitch + QR (light) */
.A { background: #EEF3F0; color: #10282B; }
.A .auth { color: #4E6467; }
.A .main { display: grid; grid-template-columns: 0.76in 1fr; column-gap: 0.16in; min-height: 0; }
.A .photo { width: 0.76in; height: 0.76in; }
.A .name { margin-top: 0.04in; font-size: 7pt; font-weight: 800; line-height: 1.1; }
.A .role { font-size: 5.6pt; color: #4E6467; font-weight: 500; line-height: 1.2; }
.A .vote { margin-top: 0.03in; font-size: 5.4pt; font-weight: 800; color: #C4522A; text-transform: uppercase; letter-spacing: .08em; }
.A .right { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
.A h2 { margin: 0; font-size: 10.4pt; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; }
.A .pitch { margin: 0.03in 0 0; font-size: 6.1pt; line-height: 1.22; }
.A .contact { align-self: end; display: grid; grid-template-columns: 1fr 0.55in; column-gap: 0.12in; align-items: end; }
.A .url { font-size: 8pt; font-weight: 800; text-align: right; line-height: 1.1; }
.A .mail { font-size: 5.7pt; font-weight: 500; color: #4E6467; text-align: right; }
.A .scan { font-size: 4.5pt; color: #4E6467; text-align: right; margin-top: .01in; line-height: 1.15; }
.A .qr { width: 0.55in; height: 0.55in; }

/* B: the sign, continued (teal) */
.B { background: #0E4F5C; color: #fff; }
.B .rule { position: absolute; inset: 0.25in; border: 2px solid rgba(255,255,255,.38); border-radius: 3px; }
.B .auth { color: rgba(255,255,255,.75); }
.B .main { display: grid; grid-template-columns: 1fr 0.78in; column-gap: 0.18in; min-height: 0; }
.B h2 { margin: 0; font-size: 14pt; font-weight: 800; line-height: .98; letter-spacing: -0.025em; }
.B h2 .em { color: #E9B640; }
.B .pitch { margin: 0.05in 0 0; font-size: 6.6pt; line-height: 1.25; color: rgba(255,255,255,.92); }
.B .url { margin-top: 0.05in; font-size: 9pt; font-weight: 800; }
.B .mail { font-size: 6pt; color: rgba(255,255,255,.8); font-weight: 500; }
.B .qrbox { width: 0.78in; height: 0.78in; background: #fff; border-radius: 4px; padding: 0.06in; box-sizing: border-box; align-self: start; }
.B .scan { margin-top: 0.05in; font-size: 4.9pt; color: rgba(255,255,255,.8); text-align: center; line-height: 1.2; }

/* C: the platform, short (light, two columns of items) */
.C { background: #EEF3F0; color: #10282B; }
.C .auth { color: #4E6467; }
.C .main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.C .kick { font-size: 5.4pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #C4522A; }
.C h2 { margin: 0.02in 0 0; font-size: 10pt; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.C ol { margin: 0.03in 0 0; padding: 0; list-style: none; columns: 2; column-gap: 0.12in; font-size: 5.3pt; line-height: 1.18; }
.C li { display: grid; grid-template-columns: 0.12in 1fr; gap: 0.02in; break-inside: avoid; margin-bottom: 0.012in; }
.C li b { color: #C4522A; font-weight: 800; font-size: 5.5pt; }
.C .foot { display: grid; grid-template-columns: 1fr auto 0.42in; column-gap: 0.1in; align-items: end; margin-top: 0.02in; }
.C .url { font-size: 8pt; font-weight: 800; line-height: 1.1; }
.C .mail { font-size: 5.6pt; color: #4E6467; font-weight: 500; }
.C .vote { font-size: 5.4pt; font-weight: 800; color: #C4522A; text-transform: uppercase; letter-spacing: .08em; text-align: right; line-height: 1.2; }
.C .qr { width: 0.42in; height: 0.42in; }

/* D: your voice (light, question-led) */
.D { background: #EEF3F0; color: #10282B; }
.D .auth { color: #4E6467; }
.D .main { display: grid; grid-template-columns: 1fr 0.7in; column-gap: 0.18in; min-height: 0; }
.D .kick { font-size: 5.4pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #C4522A; }
.D h2 { margin: 0.02in 0 0; font-size: 11.2pt; font-weight: 800; line-height: .98; letter-spacing: -0.025em; }
.D .q { margin: 0.04in 0 0; font-size: 6.2pt; line-height: 1.22; }
.D .q b { font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 700; }
.D .promise { margin-top: 0.03in; font-size: 5.1pt; color: #4E6467; line-height: 1.2; }
.D .side { display: grid; grid-template-rows: auto 1fr auto; text-align: center; }
.D .photo { width: 0.56in; height: 0.56in; margin: 0 auto; }
.D .qr { width: 0.5in; height: 0.5in; margin: 0 auto; }
.D .url { font-size: 6.6pt; font-weight: 800; margin-top: 0.03in; line-height: 1.1; }
.D .mail { font-size: 4.8pt; color: #4E6467; }

/* E: minimal (light, big URL) */
.E { background: #EEF3F0; color: #10282B; }
.E .auth { color: #4E6467; }
.E .main { display: grid; grid-template-columns: 1.05in 1fr; column-gap: 0.2in; align-items: center; min-height: 0; }
.E .photo { width: 1.05in; height: 1.05in; }
.E .stack { display: grid; gap: 0.05in; }
.E .name { font-size: 9pt; font-weight: 800; line-height: 1.05; letter-spacing: -0.01em; }
.E .role { font-size: 6.2pt; color: #4E6467; font-weight: 500; }
.E .url { font-size: 11.5pt; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.E .mail { font-size: 6.2pt; color: #4E6467; font-weight: 500; }
.E .vote { font-size: 6pt; font-weight: 800; color: #C4522A; text-transform: uppercase; letter-spacing: .1em; }
.E .qrrow { display: grid; grid-template-columns: 0.5in 1fr; column-gap: 0.08in; align-items: center; }
.E .qr { width: 0.5in; height: 0.5in; }
.E .scan { font-size: 4.9pt; color: #4E6467; line-height: 1.2; }
</style></head><body><div class="card front"><div class="rule"></div><div class="fin disp"><div class="eyebrow">Township of Esquimalt · 2026</div><h1>Tyler<br>Russell</h1><div class="for">for <b>Esquimalt Council</b></div></div><div class="sticker disp"><small>Vote</small><b>Oct 17</b><small>Saturday</small></div></div></body></html>
